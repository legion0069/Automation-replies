services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram_auto_dm_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - PAGE_ACCESS_TOKEN=${PAGE_ACCESS_TOKEN}
      - INSTAGRAM_ACCOUNT_ID=${INSTAGRAM_ACCOUNT_ID}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-instagram_dm}
      - CONFIG_PATH=/app/config.json
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    volumes:
      - ./config.json:/app/config.json
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ig_network

  db:
    image: postgres:16-alpine
    container_name: instagram_auto_dm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-instagram_dm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-instagram_dm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ig_network

volumes:
  postgres_data:
  app_logs:

networks:
  ig_network:
    driver: bridge
